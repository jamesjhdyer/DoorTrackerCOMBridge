name: Build Windows

# Builds the one Windows download for this app: scanners, label printing, AND
# Delivery Photos, all in a single installer/portable exe. Runs on every push
# to main, or press "Run workflow" on the Actions tab.
#
# The automated tests run on this real Windows runner and MUST pass before a
# package is built - there is no continue-on-error here. A failing test fails
# this whole build; no package is produced or published from code whose tests
# did not pass.
#
# Pushing a version tag (v1.3.0) does the same AND THEN - only if the tests,
# build and package checks all passed - creates a DRAFT GitHub Release with
# the installer, its update metadata and the portable exe attached (see the
# "release" job). The in-app updater ignores drafts; it sees the release once
# it is published on GitHub. Ordinary pushes to main never create a release.

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Pinned to Node 24, not 'lts/*': when Node 26 became LTS (2026-10-28),
      # Electron 31's postinstall (extract-zip 2.0.1 / yauzl 2.10.0) began
      # stopping part-way through unpacking under Node 26 and still exiting 0,
      # so "npm ci" looked fine but left node_modules/electron with no
      # path.txt - and require('electron') then throws. Move to a newer Node
      # only together with an Electron upgrade that installs cleanly on it.
      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # A release tag must name exactly the version being built - otherwise
      # the installer, latest.yml and the tag would disagree and the in-app
      # updater would refuse the release. Checked first, before anything else.
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${VERSION} (expected tag v${VERSION})."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package.json version ${VERSION}."

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # Runs on a real Windows machine: the scanner/printer tests (including
      # the real Win32 raw-printer submission path and the print-job recovery
      # logic) and every Delivery Photos test - real forked worker processes,
      # a real generated certificate actually TLS-handshaked over localhost,
      # a real UDP mDNS round-trip (skips cleanly rather than failing if this
      # particular runner's network does not allow multicast - see
      # src/delivery-photos/mdns.test.js), and the real local HTTPS server.
      # If this fails, the build stops here.
      - name: Automated checks
        run: npm test

      - name: Build Windows app
        run: npm run dist:win

      # A config mistake in package.json's "files"/"asarUnpack" (which files
      # actually get packaged) would not show up as a test failure or even a
      # build failure - electron-builder would happily ship an app missing
      # the Delivery Photos web assets. Checked here instead, against the
      # real packaged output, so that specific mistake can never ship silently.
      - name: Verify Delivery Photos assets are really in the package
        shell: bash
        run: |
          UNPACKED="dist/win-unpacked/resources/app.asar.unpacked/delivery-photos-web"
          for f in "index.html" "app.js" "camera.js" "scanner.js" "offline-queue.js" "sw.js" "manifest.webmanifest" "icon-180.png" "icon-512.png" "vendor/zxing/zxing-reader.js" "vendor/zxing/zxing_reader.wasm"; do
            if [ ! -f "$UNPACKED/$f" ]; then
              echo "Missing from the packaged app: delivery-photos-web/$f"
              exit 1
            fi
          done
          echo "Delivery Photos web assets confirmed present in the built package."

      # The same idea for the in-app updater and Remote Admin: the release
      # assets under the exact names the updater looks for, latest.yml whose
      # SHA-512 really matches the installer, app-update.yml, and the updater,
      # Remote Admin (with its web page) and electron-updater inside app.asar.
      - name: Verify updater and Remote Admin files are really in the package
        run: node scripts/verify-package.js

      # Just the files a GitHub Release carries, for the release job below.
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            dist/DoorTrackerCOMBridge-Setup-*.exe
            dist/DoorTrackerCOMBridge-Setup-*.exe.blockmap
            dist/DoorTrackerCOMBridge-Portable-*.exe
            dist/latest.yml

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoorTrackerCOMBridge-Windows
          path: dist/
          if-no-files-found: error

  # Only for a version tag, and only after everything above succeeded. The
  # one place with permission to write to the repository (creating the
  # release); it never builds or runs project code itself.
  release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets

      - name: Add SHA256SUMS.txt
        working-directory: assets
        run: sha256sum DoorTrackerCOMBridge-* latest.yml > SHA256SUMS.txt && cat SHA256SUMS.txt

      # A DRAFT: check it on GitHub, then press "Publish release". Fails
      # (rather than overwriting anything) if a release for this tag exists.
      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --verify-tag \
            --title "Door Tracker COM Bridge ${VERSION}" \
            --notes "Install or update with DoorTrackerCOMBridge-Setup-${VERSION}.exe (or from the app's Updates tab once this release is published). The portable exe is for troubleshooting only and cannot update itself. latest.yml and the .blockmap are used by the in-app updater - leave them attached." \
            assets/DoorTrackerCOMBridge-Setup-${VERSION}.exe \
            assets/DoorTrackerCOMBridge-Setup-${VERSION}.exe.blockmap \
            assets/DoorTrackerCOMBridge-Portable-${VERSION}.exe \
            assets/latest.yml \
            assets/SHA256SUMS.txt
